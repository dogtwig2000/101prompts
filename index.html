document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

', Helvetica, Arial, sans-serif;\n    font-size: 120px;\n    font-weight: 400;\n    letter-spacing: -0.02em;\n    color: #FFD000;\n    line-height: 1;\n    white-space: nowrap;\n    font-variant-numeric: tabular-nums;\n  }\n\n  .prompt-zone {\n    padding: 28px 40px 36px;\n    min-height: 160px;\n    display: flex;\n    align-items: center;\n  }\n\n  .prompt-text {\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    font-size: 36px;\n    font-weight: 400;\n    color: #FFFFFF;\n    line-height: 1.2;\n    letter-spacing: 0em;\n    opacity: 0;\n  }\n\n  .prompt-text.visible {\n    animation: snap 0.22s cubic-bezier(0.22,1,0.36,1) forwards;\n  }\n\n  .prompt-placeholder {\n    font-family: 'DOG Regular', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    font-size: 22px;\n    font-weight: 400;\n    color: rgba(255,255,255,0.2);\n    line-height: 1.4;\n  }\n\n  @keyframes snap {\n    from { opacity: 0; transform: translateY(8px); }\n    to   { opacity: 1; transform: translateY(0); }\n  }\n\n  .btn-next {\n    width: 100%;\n    margin-top: 14px;\n    padding: 22px 28px;\n    background: #0A0A0A;\n    border: none;\n    border-radius: 20px;\n    color: #FFD000;\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    font-size: 28px;\n    font-weight: 400;\n    letter-spacing: 0.02em;\n    text-transform: uppercase;\n    cursor: pointer;\n    transition: background 0.14s ease, transform 0.11s ease;\n    -webkit-tap-highlight-color: transparent;\n    text-align: center;\n  }\n\n  .btn-next:hover  { background: #1c1c1c; }\n  .btn-next:active { transform: scale(0.975); background: #111; }\n  .btn-next:focus-visible { outline: 3px solid #0A0A0A; outline-offset: 3px; }\n\n  .btn-danny {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 8px;\n    width: 100%;\n    margin-top: 10px;\n    padding: 18px 28px;\n    background: transparent;\n    border: 2px solid #CC2200;\n    border-radius: 20px;\n    color: #CC2200;\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    font-size: 24px;\n    font-weight: 400;\n    letter-spacing: -0.01em;\n    text-decoration: none;\n    cursor: pointer;\n    transition: border-color 0.14s ease, color 0.14s ease, transform 0.11s ease;\n    -webkit-tap-highlight-color: transparent;\n    text-align: center;\n  }\n\n  .btn-danny:hover  { border-color: #E02500; color: #E02500; }\n  .btn-danny:active { transform: scale(0.975); opacity: 0.8; }\n\n  .btn-completed {\n    display: block;\n    width: 100%;\n    margin-top: 10px;\n    padding: 16px 28px;\n    background: rgba(0,0,0,0.12);\n    border: none;\n    border-radius: 20px;\n    color: #0A0A0A;\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    font-size: 24px;\n    font-weight: 400;\n    letter-spacing: 0.02em;\n    cursor: pointer;\n    transition: background 0.14s ease, transform 0.11s ease;\n    -webkit-tap-highlight-color: transparent;\n    text-align: center;\n  }\n  .btn-completed:hover  { background: rgba(0,0,0,0.2); }\n  .btn-completed:active { transform: scale(0.975); }\n\n  /* Modal overlay */\n  .modal-overlay {\n    display: none;\n    position: fixed;\n    inset: 0;\n    background: #0A0A0A;\n    z-index: 100;\n    overflow-y: auto;\n    -webkit-overflow-scrolling: touch;\n  }\n  .modal-overlay.open { display: block; }\n\n  .modal-inner {\n    max-width: 560px;\n    margin: 0 auto;\n    padding: 40px 28px 80px;\n  }\n\n  .modal-header {\n    display: flex;\n    align-items: flex-start;\n    justify-content: space-between;\n    margin-bottom: 8px;\n  }\n\n  .modal-title {\n    font-size: 44px;\n    font-weight: 400;\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    color: #FFFFFF;\n    letter-spacing: 0em;\n    line-height: 1.05;\n  }\n\n  .modal-close {\n    background: rgba(255,255,255,0.1);\n    border: none;\n    border-radius: 50%;\n    width: 40px;\n    height: 40px;\n    cursor: pointer;\n    color: #fff;\n    font-size: 20px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n    margin-left: 16px;\n    margin-top: 2px;\n    transition: background 0.14s ease;\n    font-family: 'DOG Regular', inherit;\n  }\n  .modal-close:hover { background: rgba(255,255,255,0.18); }\n\n  .modal-instruction {\n    font-size: 18px;\n    font-weight: 400;\n    font-family: 'DOG Regular', sans-serif;\n    color: rgba(255,255,255,0.35);\n    margin-bottom: 28px;\n    letter-spacing: 0.01em;\n  }\n\n  .modal-stats {\n    font-size: 18px;\n    font-weight: 400;\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    color: #FFD000;\n    letter-spacing: 0.04em;\n    text-transform: uppercase;\n    margin-bottom: 24px;\n  }\n\n  .prompt-list {\n    display: flex;\n    flex-direction: column;\n    gap: 2px;\n  }\n\n  .prompt-item {\n    display: flex;\n    align-items: center;\n    gap: 16px;\n    padding: 14px 16px;\n    border-radius: 12px;\n    cursor: pointer;\n    transition: background 0.12s ease;\n    user-select: none;\n    -webkit-tap-highlight-color: transparent;\n  }\n  .prompt-item:hover { background: rgba(255,255,255,0.05); }\n  .prompt-item.done  { background: rgba(255,208,0,0.07); }\n\n  .check-box {\n    width: 26px;\n    height: 26px;\n    border-radius: 6px;\n    border: 2px solid rgba(255,255,255,0.2);\n    flex-shrink: 0;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    transition: border-color 0.15s ease, background 0.15s ease;\n  }\n  .prompt-item.done .check-box {\n    border-color: #FFD000;\n    background: #FFD000;\n  }\n\n  .check-icon {\n    display: none;\n    width: 14px;\n    height: 14px;\n  }\n  .prompt-item.done .check-icon { display: block; }\n\n  .prompt-item-num {\n    font-size: 18px;\n    font-weight: 400;\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n f a chair\" },\n  { n: 43,  text: \"Draw a fish, dead or alive\" },\n  { n: 44,  text: \"Draw a box of cereal\" },\n  { n: 45,  text: \"Draw a stranger\" },\n  { n: 46,  text: \"Draw three of your shirts\" },\n  { n: 47,  text: \"Draw ten things in twenty minutes\" },\n  { n: 48,  text: \"Draw a toilet\" },\n  { n: 49,  text: \"Draw a reflection\" },\n  { n: 50,  text: \"Draw six shadows\" },\n  { n: 51,  text: \"Draw the Mona Lisa\" },\n  { n: 52,  text: \"Draw yourself as you were\" },\n  { n: 53,  text: \"Draw yourself first thing\" },\n  { n: 54,  text: \"Draw yourself looking happy\" },\n  { n: 55,  text: \"Draw a shoe from above\" },\n  { n: 56,  text: \"Draw a shoe from one side\" },\n  { n: 57,  text: \"Draw your breakfast\" },\n  { n: 58,  text: \"Draw your pens\" },\n  { n: 59,  text: \"Draw someone you admire\" },\n  { n: 60,  text: \"Draw someone walking\" },\n  { n: 61,  text: \"Draw the last photo you took\" },\n  { n: 62,  text: \"Draw your doorway\" },\n  { n: 63,  text: \"Draw a picture in a frame\" },\n  { n: 64,  text: \"Draw a wild animal\" },\n  { n: 65,  text: \"Draw a used tube of toothpaste\" },\n  { n: 66,  text: \"Draw a sweater\" },\n  { n: 67,  text: \"Draw a coin\" },\n  { n: 68,  text: \"Draw a tool\" },\n  { n: 69,  text: \"Draw the weather\" },\n  { n: 70,  text: \"Draw a map from your childhood\" },\n  { n: 71,  text: \"Draw the inside of your fridge\" },\n  { n: 72,  text: \"Draw something growing in your house\" },\n  { n: 73,  text: \"Draw a bottle of shampoo\" },\n  { n: 74,  text: \"Draw some medicine\" },\n  { n: 75,  text: \"Draw everything in your pocket\" },\n  { n: 76,  text: \"Draw a landmark from memory\" },\n  { n: 77,  text: \"Draw a cartoon character from memory\" },\n  { n: 78,  text: \"Draw a toy from memory\" },\n  { n: 79,  text: \"Draw something scary\" },\n  { n: 80,  text: \"Draw something from a movie\" },\n  { n: 81,  text: \"Draw something funny\" },\n  { n: 82,  text: \"Draw a musical instrument\" },\n  { n: 83,  text: \"Draw someone wearing a hat\" },\n  { n: 84,  text: \"Draw a horse\" },\n  { n: 85,  text: \"Draw a chicken\" },\n  { n: 86,  text: \"Draw three different birds\" },\n  { n: 87,  text: \"Draw a cat chilling out\" },\n  { n: 88,  text: \"Draw yourself in profile\" },\n  { n: 89,  text: \"Draw three pieces of unopened mail\" },\n  { n: 90,  text: \"Draw whatever's in front of you right now\" },\n  { n: 91,  text: \"Draw a sandwich\" },\n  { n: 92,  text: \"Draw street signage\" },\n  { n: 93,  text: \"Draw an old photo, edge to edge\" },\n  { n: 94,  text: \"Draw someone sleeping\" },\n  { n: 95,  text: \"Draw the view through a door\" },\n  { n: 96,  text: \"Draw some spices\" },\n  { n: 97,  text: \"Draw whatever is on your kitchen counter\" },\n  { n: 98,  text: \"Draw whatever is on your desk\" },\n  { n: 99,  text: \"Draw whatever is on your bedside\" },\n  { n: 100, text: \"Draw the view from your bedroom\" },\n  { n: 101, text: \"Draw the view from the toilet\" }\n];\n\nlet remaining = [...prompts];\nlet spinning = false;\nlet hasStarted = false;\n\nconst drum        = document.getElementById('slotDrum');\nconst promptText  = document.getElementById('promptText');\nconst placeholder = document.getElementById('placeholder');\nconst btn         = document.getElementById('nextBtn');\nconst zone        = document.getElementById('numberZone');\n\nfunction getSlotHeight() {\n  const first = drum.querySelector('.slot-num');\n  return first ? first.offsetHeight : 120;\n}\n\nfunction shuffle(arr) {\n  for (let i = arr.length - 1; i > 0; i--) {\n    const j = Math.floor(Math.random() * (i + 1));\n    [arr[i], arr[j]] = [arr[j], arr[i]];\n  }\n  return arr;\n}\n\nfunction getNext() {\n  if (remaining.length === 0) remaining = shuffle([...prompts]);\n  const idx = Math.floor(Math.random() * remaining.length);\n  return remaining.splice(idx, 1)[0];\n}\n\nfunction spinTo(targetNum, targetText) {\n  if (spinning) return;\n  spinning = true;\n\n  promptText.classList.remove('visible');\n  promptText.style.opacity = '0';\n  placeholder.style.opacity = '0';\n  placeholder.style.display = 'none';\n\n  const slotH = getSlotHeight();\n  const count = 45;\n  const sequence = [];\n  for (let i = 0; i < count - 1; i++) {\n    sequence.push(Math.floor(Math.random() * 101) + 1);\n  }\n  sequence.push(targetNum);\n\n  drum.innerHTML = '';\n  sequence.forEach(n => {\n    const div = document.createElement('div');\n    div.className = 'slot-num';\n    div.textContent = n;\n    drum.appendChild(div);\n  });\n  drum.style.transform = 'translateY(0)';\n\n  let frame = 0;\n\n  function step() {\n    drum.style.transform = `translateY(${-frame * slotH}px)`;\n    frame++;\n\n    if (frame >= sequence.length) {\n      spinning = false;\n      promptText.textContent = targetText;\n      promptText.classList.remove('visible');\n      void promptText.offsetWidth;\n      promptText.classList.add('visible');\n      return;\n    }\n\n    const progress = frame / (sequence.length - 1);\n    let delay;\n    if (progress < 0.45) {\n      delay = 28 + progress * 30;\n    } else if (progress < 0.75) {\n      delay = 45 + (progress - 0.45) * 180;\n    } else {\n      delay = 100 + (progress - 0.75) * 500;\n    }\n\n    setTimeout(step, delay);\n  }\n\n  requestAnimationFrame(step);\n}\n\nfunction trigger() {\n  const prompt = getNext();\n  spinTo(prompt.n, prompt.text);\n}\n\nbtn.addEventListener('click', () => { hasStarted = true; trigger(); });\nzone.addEventListener('click', () => { if (hasStarted) trigger(); });\nzone.addEventListener('keydown', e => {\n  if ((e.key === 'Enter' || e.key === ' ') && hasStarted) trigger();\n});\n\n// --- Completed prompts modal ---\nconst STORAGE_KEY = 'sbs_completed_prompts';\n\nfunction loadCompleted() {\n  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }\n  catch(e) { return new Set(); }\n}\n\nfunction saveCompleted(set) {\n  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch(e) {}\n}\n\nlet completed = loadCompleted();\n\nfunction updateStats() {\n  document.getElementById('modalStats').textContent =\n    completed.size + ' of 101 completed';\n}\n\nfunction buildList() {\n  const list = document.getElementById('promptList');\n  list.innerHTML = '';\n  prompts.forEach(p => {\n    const item = document.createElement('div');\n    item.className = 'prompt-item' + (completed.has(p.n) ? ' done' : '');\n    item.dataset.n = p.n;\n    item.innerHTML =\n      '<div class=\"check-box\">' +\n        '<svg class=\"check-icon\" viewBox=\"0 0 14 14\" fill=\"none\">' +\n          '<path d=\"M2 7l3.5 3.5L12 4\" stroke=\"#0A0A0A\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>' +\n        '<\u002Fsvg>' +\n      '<\u002Fdiv>' +\n      '<div class=\"prompt-item-num\">' + p.n + '<\u002Fdiv>' +\n      '<div class=\"prompt-item-text\">' + p.text + '<\u002Fdiv>';\n\n    item.addEventListener('click', () => {\n      if (completed.has(p.n)) { completed.delete(p.n); item.classList.remove('done'); }\n      else { completed.add(p.n); item.classList.add('done'); }\n      saveCompleted(completed);\n      updateStats();\n    });\n\n    list.appendChild(item);\n  });\n}\n\ndocument.getElementById('completedBtn').addEventListener('click', () => {\n  buildList();\n  updateStats();\n  document.getElementById('modalOverlay').classList.add('open');\n  document.body.style.overflow = 'hidden';\n});\n\ndocument.getElementById('modalClose').addEventListener('click', () => {\n  document.getElementById('modalOverlay').classList.remove('open');\n  document.body.style.overflow = '';\n});\n\ndocument.getElementById('resetBtn').addEventListener('click', () => {\n  if (confirm('Clear all completed prompts?')) {\n    completed.clear();\n    saveCompleted(completed);\n    buildList();\n    updateStats();\n  }\n});\n\ndocument.getElementById('modalOverlay').addEventListener('click', e => {\n  if (e.target === document.getElementById('modalOverlay')) {\n    document.getElementById('modalOverlay').classList.remove('open');\n    document.body.style.overflow = '';\n  }\n});\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
