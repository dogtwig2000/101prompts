document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>101 Prompts</title>\n<style>\n  @font-face {\n    font-family: 'DOG Chunky';\n    src: url(\"25b2ea05-0787-47bc-864e-c1bf08954b92\") format('opentype');\n    font-weight: 400;\n    font-display: block;\n  }\n  @font-face {\n    font-family: 'DOG Regular';\n    src: url(\"906e4a6f-3cba-4e3f-a7a4-566a86549642\") format('opentype');\n    font-weight: 400;\n    font-display: block;\n  }\n\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n  html, body {\n    height: 100%;\n    font-family: 'DOG Regular', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    -webkit-font-smoothing: antialiased;\n  }\n\n  body {\n    margin: 0;\n    overflow: hidden;\n    background: #FFD000;\n  }\n\n  /* ── MODE LAYERS ─────────────────────────────────────\n     Classic sits in normal flow as the base. Kitchen is a\n     fixed overlay that drawer-slides down from above. */\n  .mode {\n    position: fixed;\n    inset: 0;\n    min-height: 100vh;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    padding: 24px;\n    overflow-y: auto;\n  }\n  .classic-mode {\n    background: #FFD000;\n    --bg: #FFD000;\n    --accent: #FFD000;\n    z-index: 1;\n  }\n  .kitchen-mode {\n    background: #8FB8D6;\n    --bg: #8FB8D6;\n    --accent: #8FB8D6;\n    z-index: 2;\n    transform: translateY(-100%);\n    transition: transform 0.6s cubic-bezier(0.7, 0, 0.25, 1);\n  }\n  .kitchen-mode.open {\n    transform: translateY(0);\n  }\n\n  /* a soft band along the drawer's bottom edge so it feels like a panel\n     that \"opens\" rather than a flat swap. Visible only while kitchen is in\n     transit / fully open. */\n  .kitchen-mode::after {\n    content: \"\";\n    position: absolute;\n    left: 0; right: 0;\n    bottom: -16px;\n    height: 16px;\n    background: linear ect: none;\n    -webkit-tap-highlight-color: transparent;\n  }\n  .number-zone:active { opacity: 0.8; }\n\n  .number-display {\n    height: 120px;\n    overflow: hidden;\n  }\n  .slot-drum {\n    display: flex;\n    flex-direction: column;\n    will-change: transform;\n  }\n  .slot-num {\n    height: 120px;\n    display: flex;\n    align-items: center;\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    font-size: 120px;\n    font-weight: 400;\n    letter-spacing: -0.02em;\n    color: var(--accent);\n    line-height: 1;\n    white-space: nowrap;\n    font-variant-numeric: tabular-nums;\n  }\n\n  .prompt-zone {\n    padding: 28px 40px 36px;\n    min-height: 160px;\n    display: flex;\n    align-items: center;\n  }\n  .prompt-text {\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    font-size: 36px;\n    font-weight: 400;\n    color: #FFFFFF;\n    line-height: 1.2;\n    letter-spacing: 0em;\n    opacity: 0;\n  }\n  .prompt-text.visible {\n    animation: snap 0.22s cubic-bezier(0.22,1,0.36,1) forwards;\n  }\n  .prompt-placeholder {\n    font-family: 'DOG Regular', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    font-size: 22px;\n    font-weight: 400;\n    color: rgba(255,255,255,0.2);\n    line-height: 1.4;\n  }\n  @keyframes snap {\n    from { opacity: 0; transform: translateY(8px); }\n    to   { opacity: 1; transform: translateY(0); }\n  }\n\n  /* ── BUTTONS ────────────────────────────────────────── */\n  .btn-next {\n    width: 100%;\n    margin-top: 14px;\n    padding: 22px 28px;\n    background: #0A0A0A;\n    border: none;\n    border-radius: 20px;\n    color: var(--accent);\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    font-size: 28px;\n    font-weight: 400;\n    letter-spacing: 0.02em;\n    text-transform: uppercase;\n    cursor: pointer;\n    transition: background 0.14s ease, transform 0.11s ease;\n    -webkit-tap-highlight-color: transparent;\n    t ing: 40px 28px 80px;\n  }\n  .modal-header {\n    display: flex;\n    align-items: flex-start;\n    justify-content: space-between;\n    margin-bottom: 8px;\n  }\n  .modal-title {\n    font-size: 44px;\n    font-weight: 400;\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    color: #FFFFFF;\n    letter-spacing: 0em;\n    line-height: 1.05;\n  }\n  .modal-close {\n    background: rgba(255,255,255,0.1);\n    border: none;\n    border-radius: 50%;\n    width: 40px;\n    height: 40px;\n    cursor: pointer;\n    color: #fff;\n    font-size: 20px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n    margin-left: 16px;\n    margin-top: 2px;\n    transition: background 0.14s ease;\n    font-family: 'DOG Regular', inherit;\n  }\n  .modal-close:hover { background: rgba(255,255,255,0.18); }\n  .modal-instruction {\n    font-size: 18px;\n    font-weight: 400;\n    font-family: 'DOG Regular', sans-serif;\n    color: rgba(255,255,255,0.35);\n    margin-bottom: 28px;\n    letter-spacing: 0.01em;\n  }\n  .modal-stats {\n    font-size: 18px;\n    font-weight: 400;\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    color: var(--accent);\n    letter-spacing: 0.04em;\n    text-transform: uppercase;\n    margin-bottom: 24px;\n  }\n  .prompt-list {\n    display: flex;\n    flex-direction: column;\n    gap: 2px;\n  }\n  .prompt-item {\n    display: flex;\n    align-items: center;\n    gap: 16px;\n    padding: 14px 16px;\n    border-radius: 12px;\n    cursor: pointer;\n    transition: background 0.12s ease;\n    user-select: none;\n    -webkit-tap-highlight-color: transparent;\n  }\n  .prompt-item:hover { background: rgba(255,255,255,0.05); }\n  .prompt-item.done  { background: rgba(255,255,255,0.07); }\n  .classic-mode .prompt-item.done { background: rgba(255,208,0,0.07); }\n  .kitchen-mode .prompt-item.done { background: rgba(143,184,214,0.10); }\n\n  .check-box {\n    width: 26px;\n    height: 26px;\n    border-radius: 6px;\n    border: 2px solid rgba(255,255,255,0.2);\n    flex-shrink: 0;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    transition: border-color 0.15s ease, background 0.15s ease;\n  }\n  .prompt-item.done .check-box {\n    border-color: var(--accent);\n    background: var(--accent);\n  }\n  .check-icon {\n    display: none;\n    width: 14px;\n    height: 14px;\n  }\n  .prompt-item.done .check-icon { display: block; }\n\n  .prompt-item-num {\n    font-size: 18px;\n    font-weight: 400;\n    font-family: 'DOG Chunky', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    color: rgba(255,255,255,0.25);\n    font-variant-numeric: tabular-nums;\n    min-width: 32px;\n    flex-shrink: 0;\n  }\n  .classic-mode .prompt-item.done .prompt-item-num { color: rgba(255,208,0,0.5); }\n  .kitchen-mode .prompt-item.done .prompt-item-num { color: rgba(143,184,214,0.6); }\n\n  .prompt-item-text {\n    font-family: 'DOG Regular', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    font-size: 22px;\n    font-weight: 400;\n    color: rgba(255,255,255,0.75);\n    line-height: 1.3;\n  }\n  .prompt-item.done .prompt-item-text {\n    color: rgba(255,255,255,0.4);\n    text-decoration: line-through;\n  }\n  .classic-mode .prompt-item.done .prompt-item-text { text-decoration-color: rgba(255,208,0,0.4); }\n  .kitchen-mode .prompt-item.done .prompt-item-text { text-decoration-color: rgba(143,184,214,0.5); }\n\n  .modal-reset {\n    margin-top: 32px;\n    background: transparent;\n    border: 1px solid rgba(255,255,255,0.15);\n    border-radius: 12px;\n    padding: 12px 20px;\n    color: rgba(255,255,255,0.3);\n    font-family: 'DOG Regular', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n    font-size: 18px;\n    font-weight: 400;\n    letter-spacing: 0.04em;\n    text-transform: uppercase;\n    cursor: pointer;\n    transition: color 0.14s ease, border-color 0.14s ease;\n  }\n  .modal-reset:hover { color: rgba(
